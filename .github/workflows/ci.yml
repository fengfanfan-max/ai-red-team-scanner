name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest -q
      - name: Migrations up-to-date
        run: uv run alembic upgrade head

  backend-pg:
    name: Backend (Postgres dialect)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: scanner
          POSTGRES_PASSWORD: scanner
          POSTGRES_DB: scanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scanner"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Sync dependencies
        run: uv sync --frozen
      - name: Test (Postgres)
        run: uv run pytest -q
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://scanner:scanner@localhost:5432/scanner

  e2e:
    name: E2E (simulated engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Playwright browsers are ~170MB — cache them so install is a no-op
      # on cache hits (keyed on the lockfile so version bumps invalidate).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start backend (simulated)
        working-directory: backend
        env:
          SIMULATE_SCAN: 'true'
          DATABASE_URL: sqlite+aiosqlite:///./e2e.db
        # Use venv binaries directly (not `uv run`): a lingering uv process
        # would hold the uv cache lock and time out setup-uv's cache-save
        # post step (300s), failing the job after tests already passed.
        run: |
          .venv/bin/alembic upgrade head
          nohup .venv/bin/uvicorn app.main:app --port 8000 >/tmp/backend.log 2>&1 &
      - name: Start frontend
        working-directory: frontend
        run: nohup npm run dev -- --port 5173 >/tmp/frontend.log 2>&1 &
      - name: Wait for servers
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost:8000/api/health && break; sleep 1; done
          for i in $(seq 1 30); do curl -sf http://localhost:5173 >/dev/null && break; sleep 1; done
      - name: Run E2E
        working-directory: frontend
        run: npx playwright test

  frontend:
    name: Frontend (lint + type-check + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
