name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify version consistency
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"0.1.0\"" frontend/package.json && echo "frontend ok"
          grep -q 'version = "0.1.0"' backend/pyproject.toml && echo "backend ok"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
